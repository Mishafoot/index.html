<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота 2.5 | Фотогалерея</title>
    <!-- Підключення jQuery (Завдання 7) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        h2 {
            color: #2c3e50;
        }
        .header-info {
            background: #fff;
            padding: 15px;
            border-left: 5px solid #3498db;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .controls {
            margin-bottom: 20px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            margin-right: 8px;
            margin-bottom: 5px;
        }
        button:hover {
            background-color: #2980b9;
        }
        /* Стилі галереї з теоретичних відомостей */
        #gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        #gallery img {
            width: 150px;
            height: 100px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid #bdc3c7;
            border-radius: 4px;
            transition: transform 0.2s;
        }
        #gallery img:hover {
            transform: scale(1.05);
            border-color: #3498db;
        }
        .preview-container {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: inline-block;
        }
        #mainImage {
            max-width: 100%;
            width: 400px;
            height: auto;
            border-radius: 4px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="header-info">
        <h2>Лабораторна робота 2.5. Розробка сценарію фотогалереї</h2>
        <p><strong>Виконав:</strong> ст. гр. Інф-35О, Мартинюк Михайло Віталійович</p>
    </div>

    <!-- Керування галереєю (Завдання 5, 6) -->
    <div class="controls">
        <button id="sortImages">Сортувати за алфавітом</button>
        <button id="clearGallery">Очистити галерею</button>
        <button id="loadStorage">Завантажити з Local Storage</button>
    </div>

    <!-- Контейнер галереї (Завдання 1) -->
    <div id="gallery"></div>

    <!-- Область попереднього перегляду (Завдання 4) -->
    <div class="preview-container">
        <h3>Попередній перегляд</h3>
        <img id="mainImage" src="" alt="Оберіть зображення">
    </div>

    <!-- Підключення скрипта -->
    <script src="script.js" defer></script>
</body>
</html>
